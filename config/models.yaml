# Tarifs en USD par million de tokens.
# A VERIFIER sur https://docs.claude.com avant chaque campagne de runs :
# les prix changent, et une erreur ici fausse tout ton suivi de budget.

providers:
  anthropic:
    models:
      fable:
        id: claude-fable-5-1
        input_per_mtok: 10.0
        output_per_mtok: 50.0
        # ATTENTION : des requetes sur sujets sensibles peuvent etre
        # reroutees vers Opus 5 par un mecanisme de sauvegarde.
        # D'ou le controle de divergence dans providers.py.
        routing_risk: true
      opus:
        id: claude-opus-5
        input_per_mtok: 5.0
        output_per_mtok: 25.0
        routing_risk: false
      sonnet:
        id: claude-sonnet-5
        input_per_mtok: 3.0
        output_per_mtok: 15.0
        routing_risk: false
      haiku:
        id: claude-haiku-4-5-20251001
        input_per_mtok: 1.0
        output_per_mtok: 5.0
        routing_risk: false

run:
  temperature: 0.0
  max_tokens: 1024
  max_retries: 4
  # Plafond dur en USD. Depasse -> exception, run interrompu.
  # Ne jamais lancer une boucle agentique sans ca.
  budget_cap_usd: 5.0
